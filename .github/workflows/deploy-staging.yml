name: Deploy Next.js (Staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /var/www/realproxynextjs-staging
            cd /var/www/realproxynextjs-staging

            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/Md-Abu-Rayhan/real-proxy-nextjs.git
            fi

            # Fetch and reset to staging branch
            git fetch --all
            git reset --hard origin/staging

            if [ ! -d "app" ] && [ ! -d "pages" ] && [ ! -d "src/app" ] && [ ! -d "src/pages" ]; then
              echo "Error: app or pages directory not found"
              ls -la
              exit 1
            fi

            # Auto-install Nginx config for staging.realproxy.net if missing
            if [ -d /etc/nginx/sites-available ] && [ ! -f /etc/nginx/sites-available/staging.realproxy.net ]; then
              echo "Installing Nginx configuration for staging.realproxy.net..."
              sudo cp server-setup/staging.realproxy.net.conf /etc/nginx/sites-available/staging.realproxy.net
              sudo ln -sf /etc/nginx/sites-available/staging.realproxy.net /etc/nginx/sites-enabled/staging.realproxy.net
              sudo nginx -t && sudo systemctl reload nginx || true
            fi

            # Use staging environment for build and runtime
            if [ -f .env.staging ]; then
              cp .env.staging .env.production
            fi

            npm install

            pm2 stop realproxynextjs-staging || true

            npm run build

            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public

            pm2 restart realproxynextjs-staging || pm2 start ecosystem.staging.config.js
            pm2 save
